name: Security Portfolio contracts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python tools/validate_security_portfolio_contract.py
      - run: python tools/validate_observation_guidance_contract.py
      - run: python -m unittest discover -s tests -v
