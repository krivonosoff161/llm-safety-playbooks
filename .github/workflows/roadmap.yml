name: Security Portfolio contracts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-contract:
    name: contracts (${{ matrix.os }}, py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --disable-pip-version-check build setuptools wheel
      - run: python tools/validate_security_portfolio_contract.py
      - run: python tools/validate_observation_guidance_contract.py
      - run: python tools/policy_pack.py check
      - run: python -m unittest discover -s tests -v
      - run: python -m build --outdir dist
      - run: python tools/package_smoke.py dist


  release-contract:
    name: release artifact closure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: python -m pip install ".[dev]"
      - name: Build and verify the closed release artifact set
        run: |
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          mkdir dist reproducibility-check
          python -m build --no-isolation --outdir dist .
          python -m build --no-isolation --outdir reproducibility-check .
          for output in dist reproducibility-check; do
            for artifact in "$output"/*.tar.gz; do
              python tools/normalize_sdist.py "$artifact" --epoch "$SOURCE_DATE_EPOCH"
            done
          done
          python - <<'PY'
          import hashlib
          from pathlib import Path
          def closure(root):
              return {path.name: hashlib.sha256(path.read_bytes()).hexdigest() for path in root.iterdir() if path.is_file()}
          if closure(Path("dist")) != closure(Path("reproducibility-check")):
              raise SystemExit("release artifacts are not reproducible")
          PY
          python tools/verify_release_index.py --dist-dir dist --expected llm-safety-playbooks==0.1.0
